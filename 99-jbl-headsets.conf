# WirePlumber 0.5+ configuration drop-in for JBL Quantum USB headsets.
#
# Fixes a permanently-XRUN audio device (silence + applications that stall,
# with `snd_pcm_avail after recover: Broken pipe` repeating in the log).
#
# These headsets open ALSA with a 1 ms period (48 frames at 48 kHz) on a
# 32768-frame buffer. PipeWire's graph cannot feed that, the first cycle
# underruns, `snd_pcm_recover` fails and nothing restarts the stream.
# Raising the period and the headroom yields period_size 512 and the device
# works normally.
#
# Install to one of:
#   /etc/wireplumber/wireplumber.conf.d/99-jbl-headsets.conf        (system-wide)
#   ~/.config/wireplumber/wireplumber.conf.d/99-jbl-headsets.conf   (per user)
# then: systemctl --user restart wireplumber
#
# NOTE: WirePlumber stores the last profile per card in
# ~/.local/state/wireplumber/default-profile and a remembered choice beats
# these rules. If the pro-audio profile below never applies, delete the line
# for your card from that file (with wireplumber stopped) and restart it.

monitor.alsa.rules = [
  # 1. The XRUN fix. Applied to every JBL USB playback and capture node, so it
  #    covers all Quantum models rather than one device name.
  {
    matches = [
      { node.name = "~alsa_output.usb-JBL.*" }
      { node.name = "~alsa_input.usb-JBL.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom    = 8192
      }
    }
  }

  # 2. The 360X exposes two playback PCMs:
  #      pro-output-0  2ch / 48000   (game, music, everything normal)
  #      pro-output-1  1ch / 16000   (the chat channel)
  #    They only become separate nodes under the pro-audio profile, which is
  #    what makes a real game/chat split possible. Matched by exact card name
  #    on purpose: models with a single playback PCM (e.g. the 350) gain
  #    nothing from it and should keep their normal profile.
  #
  #    For another model, replace the device.name with yours:
  #      pactl list cards short
  {
    matches = [
      { device.name = "alsa_card.usb-JBL_JBL_Quantum_360X_Wireless-00" }
    ]
    actions = {
      update-props = { device.profile = "pro-audio" }
    }
  }

  # 3. pro-output-1 is mono 16 kHz, so ordinary audio must not land there.
  #    A higher session priority keeps the 2-channel node as the default sink.
  {
    matches = [
      { node.name = "~alsa_output.usb-JBL.*pro-output-0" }
    ]
    actions = {
      update-props = { priority.session = 2500 }
    }
  }
]
